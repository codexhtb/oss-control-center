[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "oss-control-center"
version = "0.1.0"
description = "OSS Control Center backend foundation"
requires-python = ">=3.12,<3.15"
dependencies = [
  "alembic>=1.20,<1.21",
  "argon2-cffi>=25.1,<26",
  "fastapi>=0.143,<0.144",
  "psycopg[binary]>=3.3.6,<3.4",
  "pydantic>=2.12,<3",
  "sqlalchemy>=2.0.52,<2.1",
  "uvicorn>=0.53,<0.54",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "pytest>=9.1,<10",
  "ruff>=0.17,<0.18",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -p no:cacheprovider"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
