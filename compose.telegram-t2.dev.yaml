services:
  telegram_poller:
    profiles: [telegram-t2]
    image: oss-control-dev-api:local
    user: "1001:1001"
    restart: unless-stopped
    env_file:
      - .env.dev
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      TELEGRAM_BOT_TOKEN_FILE: /run/telegram/telegram-bot-token
      TELEGRAM_INITIAL_UPDATE_OFFSET: "${TELEGRAM_INITIAL_UPDATE_OFFSET:-}"
    command: ["python", "-m", "app.modules.field_dispatch.poller", "--forever"]
    depends_on:
      postgres:
        condition: service_healthy
      telegram_secret_init:
        condition: service_completed_successfully
    volumes:
      - telegram_secret_runtime:/run/telegram:ro
    networks:
      - backend
      - edge
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 25s
